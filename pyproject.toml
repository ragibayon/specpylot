[project]
name = "specpylot"
version = "1.0.0"
description = "LLM-assisted contract synthesis and CrossHair verification for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crosshair-tool>=0.0.102",
    "icontract>=2.7.3",
    "jinja2>=3.1.6",
    "langchain>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=0.1.20",
    "langchain-ollama>=0.1.4",
    "python-dotenv>=1.2.1",
]

[project.scripts]
specpylot = "specpylot.cli:main"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "pyicontract-lint>=2.1.4",
]
